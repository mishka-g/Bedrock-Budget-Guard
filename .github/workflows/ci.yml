name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            budget-guard/requirements.txt
            budget-guard/requirements-dev.txt
      - name: Install budget-guard deps
        run: pip install -r budget-guard/requirements.txt -r budget-guard/requirements-dev.txt
      - name: Test budget-guard
        run: pytest -q
        working-directory: budget-guard
      - name: Test generator
        run: |
          pip install boto3 pyyaml pytest
          pytest -q
        working-directory: generator

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            budget-guard/requirements.txt
            budget-guard/requirements-dev.txt
      - name: Install audit tools
        run: pip install -r budget-guard/requirements.txt -r budget-guard/requirements-dev.txt
      - name: pip-audit
        run: pip-audit -r budget-guard/requirements.txt
      - name: bandit
        run: >
          bandit -c bandit.yaml -ll -r budget-guard generator
          -x budget-guard/test_budget_guard.py,generator/test_scenarios.py,generator/test_denycheck.py
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact --exit-code 1
      - name: Checkov Kubernetes
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy/k8s
          framework: kubernetes
          config_file: .checkov.yaml
          quiet: true
      - name: Checkov Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          file: Dockerfile
          framework: dockerfile
          config_file: .checkov.yaml
          quiet: true

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t bedrock-budget-guard:${{ github.sha }} .
      - name: Build demo images
        run: |
          docker build -t bedrock-budget-guard-demo:${{ github.sha }} ./budget-guard
          docker build -t bedrock-generator:${{ github.sha }} ./generator
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bedrock-budget-guard:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          vuln-type: os,library
